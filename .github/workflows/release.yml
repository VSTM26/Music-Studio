name: Publish Desktop Apps

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            asset_name: Music-Studio-Windows.zip
          - os: macos-latest
            label: macOS
            asset_name: Music-Studio-macOS.zip
          - os: ubuntu-latest
            label: Linux
            asset_name: Music-Studio-Linux.tar.gz

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libnss3 libxkbcommon-x11-0

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          if [ "$RUNNER_OS" = "Linux" ]; then
            python -m pip install qtpy PySide6
          fi
          if [ "$RUNNER_OS" = "macOS" ]; then
            python -m pip install pyobjc-core pyobjc-framework-Cocoa pyobjc-framework-Quartz pyobjc-framework-Security pyobjc-framework-WebKit
          fi

      - name: Build desktop bundle
        shell: bash
        run: python scripts/build_desktop_release.py

      - name: Upload packaged app
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: release/${{ matrix.asset_name }}
          if-no-files-found: error

  publish:
    name: Publish release assets
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download packaged apps
        uses: actions/download-artifact@v5
        with:
          path: release-assets

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Music Studio ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Real packaged GUI builds of Music Studio for Windows, macOS, and Linux.

            Windows:
            Unzip the archive and open `Music Studio.exe`

            macOS:
            Unzip the archive and open `Music Studio.app`

            Linux:
            Extract the archive and run `./Music Studio`
          files: |
            release-assets/Music-Studio-Windows.zip/Music-Studio-Windows.zip
            release-assets/Music-Studio-macOS.zip/Music-Studio-macOS.zip
            release-assets/Music-Studio-Linux.tar.gz/Music-Studio-Linux.tar.gz
